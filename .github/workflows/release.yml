name: Release macOS app

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: write

env:
  SCHEME: PortPeek
  APP_NAME: PortPeek

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like 1.2.3, got: " >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Archive app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild archive \
            -project PortPeek.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk macosx \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package release
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app="$RUNNER_TEMP/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$APP_NAME-$VERSION.zip"
          shasum -a 256 "dist/$APP_NAME-$VERSION.zip" | awk '{print $1}' > "dist/$APP_NAME-$VERSION.sha256"
          lipo -info "$app/Contents/MacOS/$APP_NAME"
          mkdir -p dist/Casks
          sha256=$(cat "dist/$APP_NAME-$VERSION.sha256")
          cat > "dist/Casks/portpeek.rb" <<EOF
          cask "portpeek" do
            version "${VERSION}"
            sha256 "${sha256}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/PortPeek-#{version}.zip"
            name "PortPeek"
            desc "Lightweight macOS menu bar monitor for listening TCP and UDP ports"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            app "PortPeek.app"
          end
          EOF
          echo "sha256=$(cat dist/$APP_NAME-$VERSION.sha256)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "${{ inputs.tag_name }}" \
            "dist/$APP_NAME-$VERSION.zip" \
            "dist/$APP_NAME-$VERSION.sha256" \
            --clobber

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: dist/
